<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#15130F" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Flicksy</title>

    <!-- Flicksy Browser Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/flicksy-48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/flicksy-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/flicksy-16.png"
    />

    <!-- Apple / iOS Web App Icon -->
    <link
      rel="apple-touch-icon"
      sizes="1024x1024"
      href="/flicksy-1024.png"
    />

    <!-- PWA Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/flicksy-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/flicksy-512.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
